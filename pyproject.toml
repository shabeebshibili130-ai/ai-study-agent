[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-study-agent"
version = "1.0.0"
description = "A minimalist, goal-driven AI Study Agent demonstrating core agent foundations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=7.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
study-agent = "study_agent.cli:main"

[tool.setuptools.packages.find]
include = ["study_agent*"]
